<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" role="img" aria-label="Community roles and permissions">
  <rect width="1100" height="600" fill="#000000"/>
  <text x="550" y="54" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="26" fill="#eceef2">Roles, permissions and who holds them</text>
  <text x="550" y="84" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#8a909c">a member holds the Member role plus any roles given to them</text>

  <!-- role rows -->
  <g font-family="Arial, sans-serif">
    <g>
      <rect x="60" y="120" width="980" height="82" rx="20" fill="#0b0c10" stroke="#ffd23f" stroke-width="3"/>
      <circle cx="110" cy="161" r="22" fill="#ffd23f" stroke="#0a0b0d" stroke-width="3"/>
      <text x="150" y="156" font-size="22" font-weight="700" fill="#eceef2">Owner</text>
      <text x="150" y="182" font-size="14" fill="#8a909c">the person who created the community</text>
      <rect x="700" y="142" width="310" height="38" rx="19" fill="#ffd23f"/>
      <text x="855" y="167" text-anchor="middle" font-size="15" font-weight="700" fill="#0a0b0d">ALL PERMISSIONS</text>
    </g>
    <g>
      <rect x="60" y="222" width="980" height="82" rx="20" fill="#0b0c10" stroke="#ff8fc7" stroke-width="3"/>
      <circle cx="110" cy="263" r="22" fill="#ff8fc7" stroke="#0a0b0d" stroke-width="3"/>
      <text x="150" y="258" font-size="22" font-weight="700" fill="#eceef2">Admin</text>
      <text x="150" y="284" font-size="14" fill="#8a909c">runs the community day to day</text>
      <g font-family="Consolas, monospace" font-size="13">
        <rect x="430" y="246" width="128" height="30" rx="15" fill="#ff8fc7" fill-opacity="0.2" stroke="#ff8fc7"/>
        <text x="494" y="266" text-anchor="middle" fill="#eceef2">channels</text>
        <rect x="566" y="246" width="110" height="30" rx="15" fill="#ff8fc7" fill-opacity="0.2" stroke="#ff8fc7"/>
        <text x="621" y="266" text-anchor="middle" fill="#eceef2">roles</text>
        <rect x="684" y="246" width="128" height="30" rx="15" fill="#ff8fc7" fill-opacity="0.2" stroke="#ff8fc7"/>
        <text x="748" y="266" text-anchor="middle" fill="#eceef2">messages</text>
        <rect x="820" y="246" width="110" height="30" rx="15" fill="#ff8fc7" fill-opacity="0.2" stroke="#ff8fc7"/>
        <text x="875" y="266" text-anchor="middle" fill="#eceef2">invites</text>
        <rect x="438" y="282" width="110" height="26" rx="13" fill="#ff8fc7" fill-opacity="0.2" stroke="#ff8fc7"/>
        <text x="493" y="300" text-anchor="middle" fill="#eceef2">kick</text>
      </g>
    </g>
    <g>
      <rect x="60" y="324" width="980" height="82" rx="20" fill="#0b0c10" stroke="#7cc4ff" stroke-width="3"/>
      <circle cx="110" cy="365" r="22" fill="#7cc4ff" stroke="#0a0b0d" stroke-width="3"/>
      <text x="150" y="360" font-size="22" font-weight="700" fill="#eceef2">Moderator</text>
      <text x="150" y="386" font-size="14" fill="#8a909c">keeps the conversation healthy</text>
      <g font-family="Consolas, monospace" font-size="13">
        <rect x="430" y="348" width="128" height="30" rx="15" fill="#7cc4ff" fill-opacity="0.2" stroke="#7cc4ff"/>
        <text x="494" y="368" text-anchor="middle" fill="#eceef2">messages</text>
        <rect x="566" y="348" width="110" height="30" rx="15" fill="#7cc4ff" fill-opacity="0.2" stroke="#7cc4ff"/>
        <text x="621" y="368" text-anchor="middle" fill="#eceef2">kick</text>
      </g>
    </g>
    <g>
      <rect x="60" y="426" width="980" height="82" rx="20" fill="#0b0c10" stroke="#3ddc97" stroke-width="3"/>
      <circle cx="110" cy="467" r="22" fill="#3ddc97" stroke="#0a0b0d" stroke-width="3"/>
      <text x="150" y="462" font-size="22" font-weight="700" fill="#eceef2">Member</text>
      <text x="150" y="488" font-size="14" fill="#8a909c">everyone who has joined</text>
      <g font-family="Consolas, monospace" font-size="13">
        <rect x="430" y="450" width="128" height="30" rx="15" fill="#3ddc97" fill-opacity="0.2" stroke="#3ddc97"/>
        <text x="494" y="470" text-anchor="middle" fill="#eceef2">send messages</text>
      </g>
    </g>
  </g>

  <text x="550" y="572" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#6b7280">Custom roles can hold any mix of permissions. You can only grant what you hold.</text>
</svg>
