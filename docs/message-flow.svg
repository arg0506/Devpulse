<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" role="img" aria-label="What happens when you send a message">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffd23f"/>
    </marker>
  </defs>
  <rect width="1100" height="420" fill="#000000"/>
  <text x="550" y="54" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="24" fill="#eceef2">What happens when you press Enter</text>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g>
      <rect x="30" y="110" width="170" height="110" rx="20" fill="#0b0c10" stroke="#ffd23f" stroke-width="3"/>
      <text x="115" y="158" font-size="17" font-weight="700" fill="#eceef2">Composer</text>
      <text x="115" y="184" font-size="13" fill="#8a909c">text, file, reply</text>
    </g>
    <g>
      <rect x="235" y="110" width="170" height="110" rx="20" fill="#0b0c10" stroke="#7cc4ff" stroke-width="3"/>
      <text x="320" y="158" font-size="17" font-weight="700" fill="#eceef2">Socket event</text>
      <text x="320" y="184" font-size="13" fill="#8a909c">message:send</text>
    </g>
    <g>
      <rect x="440" y="110" width="200" height="110" rx="20" fill="#0b0c10" stroke="#ff6670" stroke-width="3"/>
      <text x="540" y="150" font-size="17" font-weight="700" fill="#eceef2">Server checks</text>
      <text x="540" y="176" font-size="13" fill="#8a909c">timeout · permission</text>
      <text x="540" y="196" font-size="13" fill="#8a909c">size · file type</text>
    </g>
    <g>
      <rect x="670" y="110" width="170" height="110" rx="20" fill="#0b0c10" stroke="#b49cff" stroke-width="3"/>
      <text x="755" y="150" font-size="17" font-weight="700" fill="#eceef2">Build message</text>
      <text x="755" y="176" font-size="13" fill="#8a909c">mentions · reply</text>
      <text x="755" y="196" font-size="13" fill="#8a909c">slash commands</text>
    </g>
    <g>
      <rect x="870" y="110" width="200" height="110" rx="20" fill="#0b0c10" stroke="#3ddc97" stroke-width="3"/>
      <text x="970" y="158" font-size="17" font-weight="700" fill="#eceef2">Broadcast</text>
      <text x="970" y="184" font-size="13" fill="#8a909c">to the channel room</text>
    </g>
  </g>

  <g stroke="#ffd23f" stroke-width="3" fill="none" marker-end="url(#arr)">
    <path d="M200 165 H235"/>
    <path d="M405 165 H440"/>
    <path d="M640 165 H670"/>
    <path d="M840 165 H870"/>
  </g>

  <!-- side effects -->
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="600" y="270" width="250" height="90" rx="18" fill="#0b0c10" stroke="#ff9f43" stroke-width="2.5"/>
    <text x="725" y="306" font-size="15" font-weight="700" fill="#eceef2">Mentioned people</text>
    <text x="725" y="330" font-size="13" fill="#8a909c">get a notification on their own room</text>
    <rect x="290" y="270" width="250" height="90" rx="18" fill="#0b0c10" stroke="#3ddc97" stroke-width="2.5"/>
    <text x="415" y="306" font-size="15" font-weight="700" fill="#eceef2">Saved to the store</text>
    <text x="415" y="330" font-size="13" fill="#8a909c">and mirrored to PostgreSQL if set</text>
  </g>
  <g stroke="#8a909c" stroke-width="2" fill="none" stroke-dasharray="5 5">
    <path d="M700 220 V270"/>
    <path d="M600 220 Q500 240 415 270"/>
  </g>
  <text x="55" y="380" font-family="Consolas, monospace" font-size="14" fill="#6b7280">A blocked, timed-out or unauthorised sender gets a private notice instead; nothing is broadcast.</text>
</svg>
